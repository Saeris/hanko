name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Check & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Active LTS and Current track the Node release calendar automatically.
        # Previous LTS is pinned; bump it once per year when a new even-numbered
        # Node major reaches LTS status.
        node-version: ["22", "lts", "latest"]
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node-version }}
          cache: true

      # Built before checking, not after.
      #
      # The example consumes the library through its published entry points —
      # `link:../..` plus the `exports` map — and those resolve types to
      # `dist/*.d.mts`. On a clean checkout there is no dist, so every
      # `@saeris/hanko` import in the example fails to typecheck and `vp check`
      # reports two dozen errors that do not exist locally, where a dist is
      # lying around from the last build.
      - run: vp pack

      - run: vp check
      - run: vp test
