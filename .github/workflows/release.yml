name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialized without cancelling: a cancelled run could tag without publishing,
# or publish without releasing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUMPY: "@varlock/bumpy@1.7.0"

jobs:
  # What would a release do right now? Read-only and credential-free — the
  # answer decides which of the two jobs below runs, and only ever one.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "lts"
          cache: true

      - id: plan
        run: vp dlx $BUMPY ci plan
        env:
          GH_TOKEN: ${{ github.token }}

  # Opens or updates the version PR: the bump and changelog, for review before
  # anything ships or deploys. Carries no deploy credentials.
  version-pr:
    name: Version PR
    needs: plan
    if: needs.plan.outputs.mode == 'version-pr'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "lts"
          cache: true

      - run: vp dlx $BUMPY ci release --expect-mode version-pr
        env:
          GH_TOKEN: ${{ github.token }}
          # A PR opened with the default token does not trigger workflows —
          # GitHub's anti-recursion guard — so a version PR created without
          # this could never satisfy its own required checks.
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }}

  # The version PR merged. Tag, publish to npm, and deploy the example.
  release:
    name: Release
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # OIDC trusted publishing to npm, so no long-lived token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "lts"
          cache: true
          registry-url: "https://registry.npmjs.org"

      # The same gate as CI, re-run against the merge commit. CI passed on the
      # version PR, but this is the commit that actually ships.
      #
      # One script, shared with CI, so the two cannot drift. The order inside
      # it matters: the example resolves `@saeris/hanko` through the `exports`
      # map, which points at `dist/`, so a clean checkout cannot typecheck it
      # until `vp pack` has run. This job had check before pack and failed the
      # moment it first reached publish mode.
      - run: vp run ci

      # Bumpy publishes the library to npm. The example is deployed by
      # Vercel's own git integration on push, not from here — see
      # `.bumpy/_config.json`.
      - run: vp dlx $BUMPY ci release --expect-mode publish
        env:
          GH_TOKEN: ${{ github.token }}
          # So a `release: published` event can trigger other workflows.
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }}
          # Yarn 4 corrupts the tarball path Bumpy reads from stdout when
          # colour is enabled, and NO_COLOR alone is not enough for Yarn 4.
          NO_COLOR: "1"
          YARN_ENABLE_COLORS: "false"
